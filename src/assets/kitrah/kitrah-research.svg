<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Kitrah desk research findings mapped to opportunities</title><desc id="desc">Editorial product design illustration for the Kitrah connected kitchen concept.</desc><rect width="1200" height="800" fill="#F7F4EF"/><text x="90" y="100" fill="#C97855" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start">DESK RESEARCH → PRODUCT OPPORTUNITIES</text><line x1="150" y1="215" x2="1080" y2="215" stroke="#E8DED5"/><circle cx="150" cy="215" r="13" fill="#C97855"/><text x="150" y="220" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700" text-anchor="middle">01</text><text x="200" y="200" fill="#2F2A27" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">INFORMATION HANDOFF</text><text x="200" y="233" fill="#6F8A6A" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Connect food to its record</text><line x1="150" y1="360" x2="1080" y2="360" stroke="#E8DED5"/><circle cx="150" cy="360" r="13" fill="#C97855"/><text x="150" y="365" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700" text-anchor="middle">02</text><text x="200" y="345" fill="#2F2A27" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">REMINDER LANGUAGE</text><text x="200" y="378" fill="#6F8A6A" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Show the source of each rule</text><line x1="150" y1="505" x2="1080" y2="505" stroke="#E8DED5"/><circle cx="150" cy="505" r="13" fill="#C97855"/><text x="150" y="510" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700" text-anchor="middle">03</text><text x="200" y="490" fill="#2F2A27" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" text-ancho